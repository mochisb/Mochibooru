name: Checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mochi
          POSTGRES_PASSWORD: mochi
          POSTGRES_DB: mochibooru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mochi -d mochibooru"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run format:check
      - run: bun run check
      - run: bun run test
      - run: bun run db:migrate
      - run: bun run test:integration
      - run: bun run build
      - run: bun x playwright install --with-deps chromium
      - name: Start application and worker
        run: |
          bun run start > /tmp/mochi-web.log 2>&1 &
          bun run worker > /tmp/mochi-worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics
          path: |
            test-results/
            /tmp/mochi-web.log
            /tmp/mochi-worker.log
